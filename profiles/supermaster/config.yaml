model:
  default: hermes-kuat
  provider: custom
  base_url: http://localhost:20128/v1
  api_key: ${HERMES_CUSTOM_LOCALHOST_20128_API_KEY}
_config_version: 50
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
fallback_providers:
  - provider: custom
    model: hermes-kode
    base_url: http://localhost:20128/v1
  - provider: custom
    model: hermes-hemat
    base_url: http://localhost:20128/v1
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
auxiliary:
  compression:
    provider: custom
    model: hermes-kode
  curator:
    provider: custom
  title_generation:
    model_upgrade_enabled: false
  background_review:
    enabled: false
compression:
  threshold: 0.4
  target_ratio: 0.15
  protect_last_n: 15
  threshold_tokens: 80000
platform_toolsets:
  cli:
    - terminal
    - file
    - web
    - skills
    - todo
    - cronjob
agent:
  api_max_retries: 2
  reasoning_effort: "high"
